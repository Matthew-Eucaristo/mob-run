<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Grow the mob, pick the gates, crush the rest. A 3D crowd-runner you can play with one thumb.">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MOB RUN">
<meta name="theme-color" content="#1b1430">
<meta property="og:type" content="website">
<meta property="og:title" content="MOB RUN">
<meta property="og:description" content="Grow the mob, pick the gates, crush the rest. A 3D crowd-runner you can play with one thumb.">
<meta property="og:url" content="https://mob-run.pages.dev/">
<meta property="og:image" content="https://mob-run.pages.dev/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/LilitaOne.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Nunito.woff2" as="font" type="font/woff2" crossorigin>
<title>MOB RUN</title>
<style>
  /* Fonts: Lilita One (display) and Nunito (text), both SIL OFL 1.1, see fonts/ */
  @font-face { font-family:'Lilita One'; src:url(fonts/LilitaOne.woff2) format('woff2'); font-display:swap; }
  @font-face { font-family:'Nunito'; src:url(fonts/Nunito.woff2) format('woff2'); font-weight:600 1000; font-display:swap; }

  :root {
    --ink:#1b1430; --ink2:#2c2348; --cream:#fff4dc; --cream2:#f1e0b8; --muted:#8f7f9e;
    --yellow:#ffcc33; --yellow-d:#d08a0e; --green:#5bd44a; --green-d:#2d8f27; --blue:#4aa3ff; --blue-d:#2463bd;
    --red:#ff4d5e; --red-d:#b3263a; --pink:#ff7ab8; --mint:#7ee081;
    --ol: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink),
          1.5px 1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px -1.5px 0 var(--ink);
    --ol-drop: var(--ol), 0 4px 0 var(--ink);
    --disp: 'Lilita One', 'Avenir Next', system-ui, sans-serif;
    --text: 'Nunito', 'Avenir Next', system-ui, sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:var(--ink); font-family:var(--text); font-weight:800;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  body { overscroll-behavior:none; }
  #game { position:fixed; inset:0; display:block; touch-action:none; }
  button { font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .ic { width:1em; height:1em; display:inline-block; vertical-align:-0.14em; flex:none; }
  .coin { display:inline-block; width:.95em; height:.95em; border-radius:50%; vertical-align:-0.13em; flex:none;
    background:radial-gradient(circle at 38% 34%, #fff2a8 0 18%, #ffd23d 19% 55%, #f0a812 56%);
    box-shadow:0 0 0 2px var(--ink), inset 0 0 0 2px rgba(255,255,255,.35); margin:0 .12em 0 .05em; }
  .confetti { position:fixed; inset:0; z-index:30; pointer-events:none; overflow:hidden; }
  .confetti i { position:absolute; top:-20px; border-radius:2px; animation:confettiFall linear forwards; }
  @keyframes confettiFall { to { transform:translate(var(--dx), 110vh) rotate(var(--rot)); } }
  .flycoin { position:fixed; left:0; top:0; z-index:8; pointer-events:none; width:15px; height:15px; margin:-7px 0 0 -7px; opacity:0; will-change:transform; }
  .disp { font-family:var(--disp); font-weight:400; letter-spacing:.5px; }
  .ol { color:#fff; text-shadow:var(--ol-drop); }

  /* ---------- HUD ---------- */
  .hud { position:fixed; z-index:5; pointer-events:none; color:#fff; }
  #hudL { top:calc(10px + env(safe-area-inset-top)); left:12px; }
  #hudL .t { display:none; }
  #hudArmy { font-family:var(--disp); font-size:40px; line-height:1; color:#fff; text-shadow:var(--ol-drop);
    transform-origin:left center; display:flex; align-items:center; gap:6px; }
  #hudArmy.pop { animation:numPop .22s ease; }
  #hudWeapon { display:inline-flex; align-items:center; gap:5px; margin-top:6px; padding:2px 9px 2px 6px; border-radius:999px;
    font-family:var(--disp); font-size:13px; letter-spacing:.6px; background:var(--ink); border:2px solid currentColor; }
  #hudWeapon .ic { font-size:14px; }
  #hudSkills { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; max-width:44vw; }
  #hudSkills span { display:inline-flex; align-items:center; gap:2px; padding:1px 5px; border-radius:7px; font-size:11px;
    background:rgba(27,20,48,.78); border:1.5px solid rgba(255,255,255,.18); color:#ffe9a8; }
  #hudSkills span .ic { font-size:12px; }
  #hudSkills span.ward { color:#bfe9ff; border-color:#bfe9ff; }
  #hudR { top:calc(10px + env(safe-area-inset-top)); right:12px; text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  #hudCoins { display:inline-flex; align-items:center; gap:4px; font-family:var(--disp); font-size:19px; padding:2px 10px 2px 6px;
    border-radius:999px; background:var(--ink); border:2px solid var(--yellow); color:#fff; transform-origin:right center; }
  #hudCoins.pop { animation:numPop .28s cubic-bezier(.2,.8,.2,1); }
  #hudDist { font-family:var(--disp); font-size:24px; text-shadow:var(--ol-drop); }
  #bestIn { display:none; font-family:var(--disp); font-size:13px; letter-spacing:.5px; padding:1px 8px; border-radius:8px;
    background:var(--yellow); color:var(--ink); border:2px solid var(--ink); margin-top:-2px; }
  #bestIn.on { display:block; animation:throb 1s ease-in-out infinite; }
  #hudLevel { top:calc(9px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-family:var(--disp); font-size:15px; letter-spacing:1px; text-shadow:var(--ol); }
  #lvlBar { top:calc(31px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    width:min(42vw,280px); height:10px; background:var(--ink); border:2px solid var(--ink); border-radius:6px; overflow:hidden;
    box-shadow:0 0 0 2px rgba(255,255,255,.15); }
  #lvlFill { height:100%; width:0%; background:linear-gradient(180deg,#ffe27a,var(--yellow) 60%,#e89c14); border-radius:4px; transition:width .18s linear; }

  #labels, #floats { position:fixed; inset:0; z-index:4; pointer-events:none; overflow:hidden; }
  .lb { position:absolute; transform:translate(-50%,-50%); font-family:var(--disp); font-size:17px; color:#fff;
    text-shadow:var(--ol); white-space:nowrap; will-change:transform,opacity; }
  .lb.boss { color:#ffd0b8; font-size:20px; }
  .lb.wall { color:#e0ebff; font-size:17px; }
  .lb.barrel { font-size:15px; }
  .lb.mob { font-size:22px; padding:1px 10px 2px; border-radius:12px; background:var(--red); border:3px solid var(--ink);
    text-shadow:0 2px 0 var(--ink); box-shadow:0 3px 0 var(--ink); }
  .lb.mob.big { background:#7a1020; animation:throb .5s ease-in-out infinite; }
  .lb.mob.band { font-size:26px; padding:2px 14px 3px; }
  .lb.cage { font-size:18px; padding:0 9px 1px; border-radius:9px; background:linear-gradient(90deg, var(--green-d) var(--hp, 100%), var(--green) var(--hp, 100%)); border:3px solid var(--ink); text-shadow:0 2px 0 var(--ink); box-shadow:0 3px 0 var(--ink); }
  .lb.best { color:var(--yellow); font-size:18px; letter-spacing:1px; }
  .fl { position:absolute; transform:translate(-50%,-50%); font-family:var(--disp); white-space:nowrap;
    text-shadow:var(--ol-drop); will-change:transform,opacity; }

  #vignette { position:fixed; inset:0; z-index:6; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse at center, transparent 52%, rgba(200,30,40,.5) 100%); transition:opacity .35s; }
  #vignette.doom { transition:opacity .18s; background:radial-gradient(ellipse at center, rgba(60,10,20,.2) 18%, rgba(90,12,24,.85) 100%); }
  #zoneBanner { position:fixed; top:25%; left:50%; transform:translate(-50%,-50%); font-family:var(--disp); font-size:42px;
    letter-spacing:2px; color:#fff; opacity:0; z-index:5; text-shadow:var(--ol-drop); pointer-events:none; transition:opacity .45s;
    white-space:nowrap; }
  #zoneBanner.go { animation:bannerIn .5s cubic-bezier(.2,1.6,.4,1); }
  #hint { position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    font-size:13px; color:var(--ink); background:var(--cream); border:2px solid var(--ink); border-radius:999px; padding:5px 14px;
    box-shadow:0 3px 0 var(--ink); z-index:5; pointer-events:none; opacity:0; transition:opacity .6s; text-align:center;
    max-width:min(92vw, 520px); line-height:1.3; }
  #hudForm { bottom:calc(16px + env(safe-area-inset-bottom)); left:12px; }
  #tut { position:fixed; left:50%; bottom:calc(3% + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:5;
    pointer-events:none; text-align:center; opacity:0; transition:opacity .3s; width:240px; }
  #tut.on { opacity:1; }
  #tut .hand { font-size:54px; color:#fff; filter:drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 0 2px var(--ink)); height:60px;
    animation:swipe 1.5s ease-in-out infinite; }
  #tut b { display:inline-block; margin-top:8px; font-family:var(--disp); font-weight:400; font-size:18px; letter-spacing:1px;
    color:#fff; text-shadow:var(--ol-drop); }
  #tut::before { content:''; position:absolute; left:28px; right:28px; top:40px; height:6px; border-radius:3px;
    background:rgba(255,255,255,.25); box-shadow:0 0 0 2px rgba(27,20,48,.5); }
  @keyframes swipe { 0%,100% { transform:translateX(-70px) rotate(-12deg); } 50% { transform:translateX(70px) rotate(12deg); } }
  #hudForm .t { font-size:10px; letter-spacing:1.5px; color:#fff; text-shadow:var(--ol); }
  #formLabel { font-family:var(--disp); font-size:15px; letter-spacing:.5px; text-shadow:var(--ol); }
  #formTrack { width:92px; height:8px; margin-top:4px; background:var(--ink); border-radius:4px; position:relative; }
  #formFill { position:absolute; top:-2px; width:12px; height:12px; border-radius:50%; background:var(--yellow);
    border:2px solid var(--ink); transition:left .08s linear; }
  #formBtns { display:none !important; }
  #pauseBtn { position:fixed; z-index:7; top:calc(102px + env(safe-area-inset-top)); right:12px; width:40px; height:40px;
    border-radius:12px; border:3px solid var(--ink); background:var(--cream); color:var(--ink); box-shadow:0 3px 0 var(--ink);
    display:none; font-size:16px; line-height:0; }
  #pauseBtn:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  #combo { top:calc(150px + env(safe-area-inset-top)); right:12px; text-align:right; font-family:var(--disp);
    font-size:17px; color:var(--yellow); opacity:0; transition:opacity .2s; text-shadow:var(--ol-drop); white-space:nowrap; }
  #bossBar { top:calc(48px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); width:min(60vw, 330px);
    text-align:center; opacity:0; transition:opacity .25s; }
  #bossBar.on { opacity:1; }
  #bossBar b { font-family:var(--disp); font-weight:400; font-size:14px; letter-spacing:1px; color:#ffb3a0; text-shadow:var(--ol); }
  #bossTrack { height:14px; margin-top:2px; border-radius:8px; background:var(--ink); border:3px solid var(--ink); overflow:hidden; }
  #bossFill { height:100%; width:100%; border-radius:5px; background:linear-gradient(180deg,#ff8a7a,var(--red) 55%,#c4223a); transition:width .12s linear; }
  #toast { position:fixed; z-index:9; top:calc(118px + env(safe-area-inset-top)); left:50%; transform:translate(-50%,-30px) scale(.9);
    opacity:0; pointer-events:none; background:var(--cream); border:3px solid var(--ink); color:var(--ink); box-shadow:0 4px 0 var(--ink);
    border-radius:16px; padding:7px 14px 8px 10px; font-size:13px; max-width:88vw; display:flex; align-items:center; gap:10px;
    transition:opacity .2s, transform .4s cubic-bezier(.2,1.5,.4,1); }
  #toast.on { opacity:1; transform:translate(-50%,0) scale(1); }
  #toast .chip { font-size:20px; width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    background:var(--green); color:#fff; border:2px solid var(--ink); flex:none; }
  #toast.rank .chip { background:var(--yellow); color:var(--ink); }
  #toast .chip .ic { color:inherit; font-size:20px; }
  #toast b { display:block; font-family:var(--disp); font-weight:400; font-size:15px; letter-spacing:.5px; color:var(--green-d); }
  #toast.rank b { color:var(--yellow-d); }

  /* ---------- buttons ---------- */
  .btn { pointer-events:auto; position:relative; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:var(--disp); font-weight:400; letter-spacing:.8px; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.35);
    border:3px solid var(--ink); border-radius:16px; padding:10px 18px; min-height:50px; font-size:19px;
    background:var(--c, var(--green)); box-shadow:inset 0 -5px 0 var(--cd, var(--green-d)), 0 4px 0 var(--ink);
    transition:transform .08s ease, box-shadow .08s ease; }
  .btn:active { transform:translateY(3px); box-shadow:inset 0 -3px 0 var(--cd, var(--green-d)), 0 1px 0 var(--ink); }
  .btn.blue { --c:var(--blue); --cd:var(--blue-d); }
  .btn.gold { --c:var(--yellow); --cd:var(--yellow-d); color:var(--ink); text-shadow:0 1px 0 rgba(255,255,255,.4); }
  .btn.cream { --c:var(--cream); --cd:var(--cream2); color:var(--ink); text-shadow:none; }
  .btn.sq { width:50px; padding:0; font-size:22px; }
  .btn.big { font-size:30px; min-height:66px; padding:10px 40px; border-radius:20px; }
  .btn small { display:block; font-family:var(--text); font-weight:900; font-size:11px; letter-spacing:.3px; text-shadow:none; opacity:.85; }
  .btn .stack { display:flex; flex-direction:column; align-items:center; line-height:1.05; }
  .btn:disabled { filter:grayscale(.85) brightness(.85); }
  .btnRow { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
  .badge { position:absolute; top:-10px; right:-10px; min-width:24px; height:24px; border-radius:12px; background:var(--red);
    border:2px solid var(--ink); color:#fff; font-size:14px; line-height:20px; padding:0 5px; display:none; text-shadow:none;
    animation:throb 1s ease-in-out infinite; }
  .badge.on { display:block; }

  /* ---------- overlays ---------- */
  .overlay { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 35%, rgba(44,35,72,.72), rgba(14,10,26,.93) 75%); color:#fff; text-align:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom)); touch-action:pan-y; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .panel { width:min(420px, 94vw); background:var(--cream); color:var(--ink); border:3px solid var(--ink); border-radius:20px;
    box-shadow:0 5px 0 var(--ink); padding:10px 12px 12px; margin-top:12px; text-align:left; }
  .panel h3 { font-family:var(--disp); font-weight:400; font-size:15px; letter-spacing:1px; color:var(--muted); margin:0 2px 6px; }

  /* logo */
  .logo { font-family:var(--disp); line-height:.86; transform:rotate(-4deg); margin-bottom:4px; animation:slam .7s cubic-bezier(.2,1.4,.4,1) both; }
  .logo span { display:block; font-size:clamp(68px, 21vw, 116px); color:var(--yellow);
    text-shadow:4px 0 0 var(--ink), -4px 0 0 var(--ink), 0 4px 0 var(--ink), 0 -4px 0 var(--ink), 3px 3px 0 var(--ink),
      -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink), 0 10px 0 var(--ink); }
  .logo span + span { color:#fff; margin-left:.5em; }
  .ribbon { display:inline-block; margin-top:14px; padding:4px 16px 5px; background:var(--red); color:#fff; border:3px solid var(--ink);
    box-shadow:0 3px 0 var(--ink); font-family:var(--disp); font-size:15px; letter-spacing:1px; transform:rotate(-2deg);
    text-shadow:0 2px 0 rgba(0,0,0,.3); }
  #menuTop { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .chip { display:inline-flex; align-items:center; gap:5px; padding:4px 11px 4px 8px; border-radius:999px; background:var(--ink2);
    border:2px solid rgba(255,255,255,.18); font-size:13px; color:#fff; }
  .chip .ic { color:var(--yellow); font-size:15px; }
  #bestLine { display:contents; }
  #rankLine { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:#d9cdec; }
  #rankLine .rk { font-family:var(--disp); font-size:15px; letter-spacing:.6px; color:#fff; display:inline-flex; align-items:center; gap:5px; }
  #rankLine .rk .ic { color:var(--yellow); }
  #rankLine .pips { display:flex; gap:3px; }
  #rankLine .pips u { width:18px; height:8px; border-radius:4px; background:var(--ink); border:1.5px solid rgba(255,255,255,.25); }
  #rankLine .pips u.f { background:var(--yellow); border-color:var(--ink); }
  #rankLine .nx { color:#a796bd; }
  .dailyBtn { display:none !important; margin-top:12px; animation:wiggle 2.4s ease-in-out infinite; }
  .dailyBtn.on { display:inline-flex !important; }
  .dailyBtn .ic { font-size:26px; }
  #playBtn { margin-top:16px; }
  .overlay .keys { margin-top:14px; font-size:11px; color:#8f80a8; }

  /* missions */
  .missions:empty { display:none; }
  .ms { position:relative; display:flex; align-items:center; gap:10px; padding:6px 4px; border-top:2px dashed rgba(27,20,48,.14); }
  .ms:first-of-type { border-top:0; }
  .ms .mi { width:34px; height:34px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center;
    font-size:19px; background:var(--ink2); color:var(--yellow); border:2px solid var(--ink); }
  .ms.done .mi { background:var(--green); color:#fff; }
  .ms .mt { flex:1; font-size:13px; line-height:1.2; }
  .ms .pg { display:block; font-size:11px; color:var(--muted); margin-top:3px; }
  .ms .bar { height:7px; margin-top:4px; background:rgba(27,20,48,.12); border-radius:4px; overflow:hidden; }
  .ms .bar i { display:block; height:100%; background:var(--green); border-radius:4px; transition:width .7s cubic-bezier(.2,.8,.2,1); }
  .ms .rw { display:inline-flex; align-items:center; gap:2px; font-family:var(--disp); font-size:16px; color:var(--ink); flex:none; }
  .ms.done .rw { color:var(--green-d); }
  .ms .nw { display:inline-block; font-family:var(--disp); font-size:10px; letter-spacing:.8px; background:var(--red); color:#fff;
    border-radius:5px; padding:0 4px; margin-right:5px; vertical-align:1px; }

  /* game over */
  #overOverlay h1, .overlay .head { font-family:var(--disp); font-weight:400; font-size:clamp(44px, 13vw, 76px); line-height:1;
    color:var(--red); text-shadow:var(--ol), 0 7px 0 var(--ink); transform:rotate(-3deg); white-space:nowrap; }
  #overOverlay.on h1 { animation:slam .55s cubic-bezier(.2,1.5,.4,1) both; }
  #overOverlay.on .stats { animation:cardIn .45s .12s both; }
  #overCause { display:inline-block; margin-top:12px; padding:3px 12px; background:var(--ink); border:2px solid var(--red);
    color:#ffb3bb; border-radius:999px; font-size:12px; letter-spacing:.8px; }
  .stats { margin-top:6px; }
  #overDist { font-family:var(--disp); font-size:62px; line-height:1.05; color:#fff; text-shadow:var(--ol-drop); }
  .stamp { display:inline-block; font-family:var(--disp); font-size:20px; letter-spacing:1px; color:var(--ink);
    background:var(--yellow); border:3px solid var(--ink); border-radius:10px; padding:1px 12px 2px; transform:rotate(-4deg);
    box-shadow:0 3px 0 var(--ink); animation:stamp .5s .9s cubic-bezier(.2,1.8,.4,1) both; }
  .close { font-size:14px; color:#ffcf9e; }
  .runline { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
  .runline .chip { font-size:12px; }
  .runline .chip .ic { color:#cdbcf0; font-size:13px; }
  .earn { margin-top:8px; font-family:var(--disp); font-size:22px; display:inline-flex; align-items:center; gap:4px; text-shadow:var(--ol); }
  .earn small { font-family:var(--text); font-size:11px; color:#b9a9d4; text-shadow:none; margin-left:6px; font-weight:800; }
  #quickBuy { display:none; margin-top:12px; --c:var(--green); --cd:var(--green-d); font-size:16px; min-height:48px; animation:cardIn .45s .35s both; }
  #quickBuy.on { display:inline-flex; }
  #quickBuy .ic { font-size:22px; }
  #reviveBtn { min-width:150px; }
  #againBtn { min-width:150px; }
  #installCard { display:none; }
  #installCard.panel { padding:12px; }
  #installCard b { font-family:var(--disp); font-weight:400; font-size:17px; }
  #installCard p { margin:6px 0 0; font-size:13px; color:#5c4f6e; }
  .installRow { display:flex; gap:8px; justify-content:center; margin-top:10px; }

  /* skills */
  #skillOverlay .head { color:var(--yellow); font-size:clamp(44px, 12vw, 64px); }
  #skillOverlay .sub { margin-top:10px; font-size:14px; color:#d9cdec; }
  #skillCards { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:14px; max-width:880px; }
  .skillCard { pointer-events:auto; position:relative; width:min(250px, 92vw); text-align:left; color:var(--ink);
    background:var(--cream); border:3px solid var(--ink); border-radius:20px; padding:14px 14px 12px; box-shadow:0 5px 0 var(--ink);
    animation:cardIn .42s cubic-bezier(.2,1.4,.4,1) both; transition:transform .1s ease; }
  .skillCard:nth-child(2) { animation-delay:.07s; }
  .skillCard:nth-child(3) { animation-delay:.14s; }
  .skillCard:hover { transform:translateY(-3px) rotate(-.6deg); }
  .skillCard:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  .skillCard i { display:inline-flex; width:48px; height:48px; border-radius:14px; align-items:center; justify-content:center; font-size:27px;
    background:var(--sc, var(--blue)); color:#fff; border:3px solid var(--ink); box-shadow:inset 0 -4px 0 rgba(0,0,0,.18); font-style:normal; }
  .skillCard b { display:block; font-family:var(--disp); font-weight:400; font-size:21px; letter-spacing:.4px; margin:8px 0 2px; }
  .skillCard span { display:block; color:#4d4060; font-size:14px; line-height:1.3; }
  .skillCard em { position:absolute; top:12px; right:12px; font-style:normal; font-family:var(--disp); font-size:12px; letter-spacing:.6px;
    padding:1px 8px; border-radius:7px; background:var(--red); color:#fff; border:2px solid var(--ink); }
  .skillCard em.up { background:var(--green); }
  .skillCard .pips { display:flex; gap:4px; margin-top:8px; }
  .skillCard .pips u { width:20px; height:7px; border-radius:4px; background:rgba(27,20,48,.14); }
  .skillCard .pips u.f { background:var(--ink2); }
  .skillCard .pips u.n { background:var(--green); animation:throb 1s ease-in-out infinite; }
  .skillCard kbd { position:absolute; bottom:10px; right:12px; font:inherit; font-size:11px; color:var(--muted);
    border:2px solid rgba(27,20,48,.2); border-radius:6px; padding:0 5px; }
  body.touch .skillCard kbd { display:none; }

  /* armory */
  #shopOverlay { z-index:12; justify-content:flex-start; padding-top:calc(18px + env(safe-area-inset-top));
    background:radial-gradient(ellipse at 50% 0%, #3a2d62, #1b1430 70%); }
  #shopOverlay .head { color:var(--blue); font-size:clamp(40px, 11vw, 60px); }
  #shopCoins { margin-top:12px; font-family:var(--disp); font-size:24px; display:inline-flex; align-items:center; gap:6px;
    background:var(--ink); border:3px solid var(--yellow); border-radius:999px; padding:2px 16px 2px 10px; }
  .shopHead { font-family:var(--disp); font-size:15px; letter-spacing:1px; color:#b9a9d4; margin:16px 0 8px; }
  #upGrid { display:grid; grid-template-columns:1fr; gap:8px; width:min(520px, 94vw); }
  .upCard { pointer-events:auto; display:flex; align-items:center; gap:12px; text-align:left; color:var(--ink);
    background:var(--cream); border:3px solid var(--ink); border-radius:18px; padding:9px 10px 9px 9px; box-shadow:0 4px 0 var(--ink); }
  .upCard:active { transform:translateY(2px); box-shadow:0 2px 0 var(--ink); }
  .upCard > i { display:inline-flex; width:46px; height:46px; border-radius:14px; align-items:center; justify-content:center; font-size:25px;
    background:var(--uc, var(--blue)); color:#fff; border:3px solid var(--ink); box-shadow:inset 0 -4px 0 rgba(0,0,0,.18); flex:none; font-style:normal; }
  .upCard .mid { flex:1; min-width:0; }
  .upCard b { display:block; font-family:var(--disp); font-weight:400; font-size:17px; letter-spacing:.4px; }
  .upCard span { display:block; font-size:12px; color:#5c4f6e; margin-top:1px; }
  .upCard span b.v { display:inline; font-family:var(--text); font-weight:900; font-size:12px; color:var(--ink); }
  .upCard span b.nx { color:var(--green-d); }
  .upCard .pips { display:flex; gap:3px; margin-top:5px; }
  .upCard .pips u { width:12px; height:7px; border-radius:3px; background:rgba(27,20,48,.14); }
  .upCard .pips em.lv { font-style:normal; font-family:var(--disp); font-size:12px; padding:0 7px; border-radius:6px; background:var(--uc); color:#fff; border:2px solid var(--ink); }
  .upCard .pips u.f { background:var(--uc, var(--blue)); box-shadow:inset 0 0 0 1.5px var(--ink); }
  .upCard .price { display:inline-flex; align-items:center; gap:3px; font-family:var(--disp); font-size:17px; white-space:nowrap;
    padding:6px 10px; border-radius:12px; border:3px solid var(--ink); background:var(--green); color:#fff; box-shadow:inset 0 -3px 0 var(--green-d);
    text-shadow:0 1px 0 rgba(0,0,0,.3); }
  .upCard.broke .price { background:#c9bcd6; box-shadow:inset 0 -3px 0 #a596b5; color:#5c4f6e; text-shadow:none; }
  .upCard.maxed .price { background:var(--ink2); box-shadow:none; color:var(--mint); }
  #shopGrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; width:min(520px, 94vw); }
  .skinCard { pointer-events:auto; text-align:center; color:var(--ink); background:var(--cream); border:3px solid var(--ink);
    border-radius:16px; padding:8px 6px 8px; box-shadow:0 4px 0 var(--ink); }
  .skinCard:active { transform:translateY(2px); box-shadow:0 2px 0 var(--ink); }
  .skinCard > i { display:block; font-size:44px; line-height:1; font-style:normal; filter:drop-shadow(0 2px 0 var(--ink)); }
  .skinCard b { display:block; font-family:var(--disp); font-weight:400; font-size:14px; letter-spacing:.4px; margin-top:4px; }
  .skinCard span { display:inline-flex; align-items:center; margin-top:4px; font-family:var(--disp); font-size:13px; padding:1px 8px;
    border-radius:8px; background:var(--green); color:#fff; border:2px solid var(--ink); }
  .skinCard.on { background:#fff; outline:3px solid var(--yellow); outline-offset:-7px; }
  .skinCard.on span { background:var(--ink2); color:var(--mint); }
  .skinCard.broke span { background:#c9bcd6; color:#5c4f6e; }
  #shopClose { margin:18px 0 6px; }

  #pauseOverlay { z-index:11; }
  #settingsOverlay { z-index:13; background:radial-gradient(ellipse at 50% 0%, #3a2d62, #1b1430 70%); }
  #settingsOverlay .head { color:var(--cream); }
  #settingsOverlay { justify-content:flex-start; padding-top:calc(18px + env(safe-area-inset-top)); }
  .recRow { display:flex; align-items:center; gap:10px; padding:5px 4px; font-size:14px; border-top:2px dashed rgba(27,20,48,.1); }
  .recRow:first-of-type { border-top:0; }
  .recRow i { font-style:normal; color:var(--blue-d); font-size:16px; width:20px; text-align:center; }
  .recRow span { flex:1; color:#4d4060; }
  .recRow b { font-family:var(--disp); font-weight:400; font-size:17px; color:var(--ink); }
  .setRow { pointer-events:auto; width:100%; display:flex; align-items:center; gap:12px; padding:10px 4px; background:none; border:0;
    border-top:2px dashed rgba(27,20,48,.14); color:var(--ink); text-align:left; }
  .setRow:first-child { border-top:0; }
  .setRow i { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px;
    background:var(--ink2); color:var(--yellow); border:2px solid var(--ink); font-style:normal; }
  .setRow b { flex:1; font-family:var(--disp); font-weight:400; font-size:18px; letter-spacing:.5px; }
  .tog { width:58px; height:32px; border-radius:16px; background:#c9bcd6; border:3px solid var(--ink); position:relative; transition:background .15s; }
  .tog u { position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:#fff; border:2px solid var(--ink); transition:left .15s; }
  .tog.on { background:var(--green); }
  .langTag { font-family:var(--disp); font-size:14px; padding:3px 10px; border-radius:9px; background:var(--blue); color:#fff; border:2px solid var(--ink); }
  .tog.on u { left:28px; }
  .hist { display:flex; align-items:flex-end; gap:4px; height:38px; width:min(260px, 70vw); margin:10px auto 0; padding:0 2px;
    border-bottom:2px solid rgba(255,255,255,.25); }
  .hist i { flex:1; border-radius:4px 4px 0 0; background:rgba(255,255,255,.28); }
  .hist i.top { background:var(--yellow); }
  .hist i.now { background:var(--green); box-shadow:0 0 0 2px var(--ink); }
  #pauseOverlay .head { color:#fff; }

  body.menu .hud, body.menu #hudForm, body.menu #pauseBtn { opacity:0 !important; }
  /* until the game script is up: PLAY reads LOADING and the menu bits that need data stay hidden */
  body.loading #playBtn { pointer-events:none; filter:grayscale(.6) brightness(.9); color:transparent; text-shadow:none; }
  body.loading #playBtn::after { content:'LOADING'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.35); font-size:22px; animation:pulse 1s ease-in-out infinite; }
  body.loading #menuTop, body.loading #rankLine, body.loading .btnRow, body.loading .keys { visibility:hidden; }
  @keyframes numPop { 0% { transform:scale(1); } 40% { transform:scale(1.2); } 100% { transform:scale(1); } }
  @keyframes throb { 0%,100% { transform:scale(1); } 50% { transform:scale(1.1); } }
  @keyframes cardIn { from { opacity:0; transform:translateY(16px) scale(.94); } to { opacity:1; transform:none; } }
  @keyframes slam { from { opacity:0; transform:scale(1.5) rotate(-4deg); } to { opacity:1; transform:scale(1) rotate(-4deg); } }
  @keyframes stamp { from { opacity:0; transform:scale(2.2) rotate(-4deg); } to { opacity:1; transform:scale(1) rotate(-4deg); } }
  @keyframes bannerIn { from { opacity:0; transform:translate(-50%,-50%) scale(1.6); } to { opacity:1; transform:translate(-50%,-50%) scale(1); } }
  @keyframes wiggle { 0%,84%,100% { transform:rotate(0); } 87% { transform:rotate(-4deg) scale(1.05); } 91% { transform:rotate(4deg) scale(1.05); } 95% { transform:rotate(-2deg); } }
  @keyframes pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }

  @media (max-width: 700px) {
    #bossBar { width:min(44vw, 330px); top:calc(50px + env(safe-area-inset-top)); }
    #bossBar b { font-size:11px; }
    #hudSkills { max-width:36vw; }
    #hudArmy { font-size:34px; }
    #hudDist { font-size:20px; }
    #hudCoins { font-size:17px; }
    #zoneBanner { font-size:30px; }
    #hint { top:calc(110px + env(safe-area-inset-top)); bottom:auto; max-width:78vw; font-size:12px; }
    .skillCard { width:min(100%, 360px); padding:10px 12px 10px; display:grid; grid-template-columns:52px 1fr; column-gap:12px; align-items:center; }
    .skillCard i { grid-row:1 / span 3; }
    .skillCard b { margin:0; font-size:19px; }
    .skillCard .pips { margin-top:4px; }
    #skillCards { gap:10px; }
  }
  @media (max-height: 760px) {
    #startOverlay, #overOverlay, #skillOverlay { justify-content:flex-start; padding-top:calc(16px + env(safe-area-inset-top)); }
    .logo span { font-size:clamp(56px, 17vw, 96px); }
    #overDist { font-size:52px; }
  }
  @media (orientation: landscape) and (max-height: 480px) {
    #hudForm { display:none; }
    .overlay .missions, #quickBuy.on, .ribbon, .overlay .keys, .hist, #tut { display:none; }
    .logo span { font-size:58px; display:inline; }
    .logo span + span { margin-left:.2em; }
    #overOverlay h1 { font-size:40px; }
    #overDist { font-size:40px; }
    #skillOverlay .head { font-size:36px; }
    #skillOverlay .sub { display:none; }
    #skillCards { flex-wrap:nowrap; margin-top:8px; }
    .skillCard { width:30vw; padding:8px 10px; }
    .skillCard i { width:38px; height:38px; font-size:21px; }
    .skillCard span { font-size:12px; }
    .btn.big { min-height:54px; font-size:24px; }
  }
</style>
</head>
<body class="menu loading">
<canvas id="game"></canvas>
<div id="labels"></div>
<div id="floats"></div>
<div class="hud" id="hudL"><div class="t">ARMY</div><div id="hudArmy">10</div><div id="hudWeapon">PISTOL</div><div id="hudSkills"></div></div>
<div class="hud" id="hudR"><div id="hudCoins"><span class="coin"></span>0</div><div id="hudDist">0m</div><div id="bestIn"></div></div>
<div class="hud" id="hudLevel"></div>
<div class="hud" id="lvlBar"><div id="lvlFill"></div></div>
<div id="zoneBanner"></div>
<div id="toast"></div>
<button type="button" id="pauseBtn" aria-label="Pause"></button>
<div class="hud" id="bossBar"><b id="bossName">BOSS</b><div id="bossTrack"><div id="bossFill"></div></div></div>
<div class="hud" id="combo"></div>
<div id="vignette"></div>
<div id="hint"></div>
<div id="tut"></div>
<div class="hud" id="hudForm"><div class="t">FORMATION</div><div id="formLabel">SQUARE</div><div id="formTrack"><div id="formFill"></div></div></div>
<div id="formBtns">
  <button type="button" id="btnCol">COLUMN</button>
  <button type="button" id="btnWide">WIDE</button>
</div>

<div class="overlay" id="startOverlay">
  <div class="logo"><span>MOB</span><span>RUN</span></div>
  <div class="ribbon">GROW THE MOB · CRUSH THE REST</div>
  <div id="menuTop"><div id="bestLine"></div></div>
  <div id="rankLine"></div>
  <button type="button" class="btn gold dailyBtn" id="dailyBtn"></button>
  <div class="missions panel" id="menuMissions"></div>
  <button type="button" class="btn big" id="playBtn">PLAY</button>
  <div class="btnRow">
    <button class="btn blue" id="shopBtn" type="button">ARMORY<span class="badge" id="shopBadge">!</span></button>
    <button class="btn cream sq" id="muteBtn" type="button" aria-label="Sound"></button>
  </div>
  <div class="keys">arrows or WASD · M mute · skills every level</div>
</div>

<div class="overlay" id="skillOverlay" style="display:none">
  <div class="head" id="skillHead">LEVEL UP!</div>
  <div class="sub">Pick one. They stack.</div>
  <div id="skillCards"></div>
</div>

<div class="overlay" id="overOverlay" style="display:none">
  <h1>WIPED OUT</h1>
  <div id="overCause"></div>
  <div class="stats" id="overStats"></div>
  <button type="button" class="btn" id="quickBuy"></button>
  <div class="missions panel" id="overMissions"></div>
  <div class="btnRow">
    <button type="button" class="btn gold" id="reviveBtn">REVIVE</button>
    <button type="button" class="btn" id="againBtn">RUN AGAIN</button>
  </div>
  <div class="btnRow">
    <button class="btn blue" id="shopBtnOver" type="button">ARMORY<span class="badge" id="shopBadgeOver">!</span></button>
    <button class="btn cream sq" id="shareBtn" type="button" aria-label="Share"></button>
  </div>
  <div id="installCard" class="panel">
    <b>PUT MOB RUN ON YOUR HOME SCREEN</b>
    <p id="installHint">It opens full screen, like an app.</p>
    <div class="installRow">
      <button type="button" class="btn" id="installBtn">INSTALL</button>
      <button type="button" class="btn cream" id="installNo">NOT NOW</button>
    </div>
  </div>
</div>

<div class="overlay" id="shopOverlay" style="display:none">
  <div class="head">ARMORY</div>
  <div id="shopCoins"></div>
  <div class="shopHead">UPGRADES</div>
  <div id="upGrid"></div>
  <div class="shopHead">SQUAD COLORS</div>
  <div id="shopGrid"></div>
  <button class="btn cream" id="shopClose" type="button">BACK</button>
</div>

<div class="overlay" id="settingsOverlay" style="display:none">
  <div class="head">SETTINGS</div>
  <div class="panel" id="setList"></div>
  <div class="panel" id="records"></div>
  <button type="button" class="btn cream" id="setClose" style="margin-top:18px">DONE</button>
</div>

<div class="overlay" id="pauseOverlay" style="display:none">
  <div class="head">PAUSED</div>
  <button type="button" class="btn big" id="resumeBtn" style="margin-top:22px">RESUME</button>
  <div class="btnRow" style="margin-top:14px">
    <button type="button" class="btn cream" id="pauseSet">SETTINGS</button>
    <button type="button" class="btn blue" id="pauseQuit">END RUN</button>
  </div>
</div>
<script type="module" src="game3d.js"></script>
</body>
</html>
